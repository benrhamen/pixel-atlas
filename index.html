<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Atlas</title><style>
body{margin:0;background:#0a0618;color:#0ff;font-family:"Courier New",monospace;display:flex;justify-content:center}
#a{width:100%;max-width:1040px;padding:14px;box-sizing:border-box}
h1{color:#f0f;text-shadow:0 0 10px #f0f;text-align:center;letter-spacing:4px;margin:6px 0 12px}
button{font:inherit;cursor:pointer;background:#120a2a;color:#0ff;border:1px solid #0ff;min-height:40px}
.row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.row button{flex:1 1 20%}
.reg button{flex:1 1 28%;color:#0f8;border-color:#0a6;font-size:12px;min-height:34px}
.on{background:#f0f4!important;color:#fff!important;border-color:#f0f!important}.reg .on{background:#0f83!important;border-color:#0a6!important}
.bar{display:flex;justify-content:space-between;border:1px solid #0ff;padding:8px;margin-top:10px}
#q{border:2px solid #f0f;margin:12px 0;padding:16px;text-align:center;font-size:19px;box-shadow:0 0 14px #f0f6;min-height:90px}
#q b{color:#fff;font-size:26px}.big{font-size:64px;line-height:1.1}
.opt{display:block;width:100%;margin:8px 0;min-height:48px;font-size:17px}
.ok{background:#0f03!important;border-color:#0f0!important;color:#0f0!important}.no{background:#f003!important;border-color:#f55!important;color:#f66!important}
#mapw{overflow-x:auto;margin:8px 0}svg{display:block;background:#050310;border:1px solid #0ff}
#mapw path{stroke:#0ff;stroke-width:.6;vector-effect:non-scaling-stroke;fill:#1a1040;cursor:pointer}#mapw path.x{fill:#0d0820;stroke:#336;cursor:default}
#mapw path.ok{fill:#0f0a;stroke:#0f0;stroke-width:2}#mapw path.no{fill:#f00a;stroke:#f55;stroke-width:2}
#f{text-align:center;min-height:24px}.sp{opacity:.4;filter:grayscale(1)}.sp.got{opacity:1;filter:drop-shadow(0 0 2px #fff)}.coll{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.coll svg{width:30px;height:30px;background:#120a2a;border:1px solid #336;padding:2px;opacity:.3;filter:grayscale(1)}.coll svg.got{opacity:1;filter:none;border-color:#0ff}.mode button{flex:1 1 40%}small{color:#889}
.flag-image{width:112px;height:84px;margin:0 auto 12px}.flag-image svg{color:#000;fill:#000;display:block;width:100%;height:100%;background:transparent;border:0}svg #mapw path.x{stroke:#777;opacity:.72}svg #mapw path.ok{stroke:#fff;stroke-width:2.5}svg #mapw path.no{stroke:#fff;stroke-width:2.5}


.fact-card{border:1px solid #778;padding:14px;margin:12px 0;background:#16102b;color:#fff;font-size:15px;line-height:1.5}.fact-card p{margin:8px 0}.fact-card a{color:#8ff}

.player-card{display:flex;gap:12px;align-items:center;border:1px solid #676;padding:10px;margin:10px 0;color:#fff;font-size:13px}.avatar-pixel{width:48px!important;height:64px;background:transparent;border:0;flex-shrink:0;image-rendering:pixelated}.player-card p{margin:6px 0}.player-card input,.player-card select{font:inherit;background:#241a37;color:#fff;max-width:150px}.player-card label,.player-card small{display:block;margin:4px 0}.player-card button{font-size:12px;min-height:32px;margin:4px 0}

.home-flag{display:inline-block;width:24px;height:18px;vertical-align:middle}.home-flag svg{display:block;width:24px;height:18px;fill:#000;color:#000;border:0;background:transparent}

.pa-scroll,#mapw{max-height:560px;min-height:300px;overflow:auto;touch-action:pan-x pan-y}.zoom-controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}.zoom-controls button{background:#120a2a;color:#0ff;border:1px solid #0ff;min-height:44px;padding:6px}.zoom-controls small{flex-basis:100%}

.park-avatar svg{width:80px;height:100px}.player-card .park-avatar{flex-shrink:0}.leader-row{display:flex;align-items:center;gap:12px;padding:8px;border-bottom:1px solid #445}.leader-row svg{width:32px;height:40px}.fact-card label{display:block;margin:10px 0}.fact-card select{background:#241a37;color:#fff;font:inherit}.fact-card button:disabled{opacity:.35}

#customPanel button{margin:3px;min-height:44px}#customPanel small{display:block;margin-top:8px}.park-portrait{max-width:80px;height:100px}.player-card svg{flex-shrink:0}
#mapw{touch-action:none}#mapw svg{touch-action:none}
#mapw:empty{display:none;min-height:0}.flag-image svg *{shape-rendering:geometricPrecision}

.avatar-tab{padding:10px!important;font-size:12px!important}.avatar-head{display:flex;align-items:center;gap:10px}.avatar-head svg{width:64px;height:80px;flex-shrink:0}.avatar-head label{display:block;margin:3px 0}.avatar-head input{display:block;background:#241a37;color:#fff;border:1px solid #778;width:100%;max-width:240px;box-sizing:border-box;font:inherit;padding:5px}.avatar-choices p{margin:4px 0!important}.avatar-choices{margin:6px 0}#customPanel button{min-height:32px;margin:2px;padding:5px;font-size:11px}#customPanel small{font-size:10px;line-height:1.2}#customPanel .zoom-controls{margin:3px 0;gap:3px}.avatar-tab b{font-size:12px}

.answer-popup{position:fixed;z-index:1000;top:50%;left:50%;transform:translate(-50%,-50%);width:calc(100% - 48px);max-width:480px;box-sizing:border-box;background:#16102b;color:#fff;border:2px solid #0ff;padding:20px;box-shadow:0 0 0 100vmax #050310b3;text-align:center;font-size:17px;line-height:1.4}.answer-popup p{margin:12px 0}.answer-popup small{display:block;font-size:11px;margin-top:12px}.answer-popup a{color:#8ff}
</style></head><body><div id="a"><h1>PIXEL ATLAS</h1><div id="player" class="player-card"></div><button id="customToggle" class="opt">Customize avatar</button><div id="customPanel"></div><details class="fact-card"><summary>Leaderboard on this device</summary><div id="leaders"></div></details>
<div id="levelLength" class="row"></div><div class="row mode" id="ds"></div><div class="row reg" id="regs"></div><div class="row" id="styles"></div><div class="row" id="sub"></div>
<div class="bar"><span id="s"></span><span id="l"></span><span id="k"></span><span id="lv"></span></div>
<div id="q"></div><div id="o"></div><div id="zoomControls" class="zoom-controls"></div><div id="mapw"></div><div id="f"></div><div id="facts"></div><div class="coll" id="coll"></div><small id="cn"></small><br><small id="b"></small></div>
