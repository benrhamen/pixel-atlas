const CONT={AF:"Africa",AS:"Asia",EU:"Europe",NA:"N. America",SA:"S. America",OC:"Oceania"};
const REG={world:{l:"World",vb:"0 0 1800 710",w:"260%"},EU:{l:"Europe",vb:"790 50 320 230",w:"220%",k:"EU"},AS:{l:"Asia",vb:"1025 30 625 470",w:"160%",k:"AS"},AF:{l:"Africa",vb:"800 230 360 370",w:"150%",k:"AF"},NA:{l:"N. America",vb:"50 0 600 390",w:"150%",k:"NA"},SA:{l:"S. America",vb:"490 350 240 360",w:"120%",k:"SA"},OC:{l:"Oceania",vb:"1430 400 370 270",w:"150%",k:"OC"},US:{l:"USA",vb:"0 0 975 610",w:"100%"}};

const $=i=>document.getElementById(i),sh=a=>[...a].sort(()=>Math.random()-.5),one=a=>a[Math.random()*a.length|0];
let st={ds:"world",style:"mc",quiz:"country",region:"world",byCap:false,score:0,lives:3,streak:0,best:0,hint:1,t:null,picked:null,opts:[],done:0,won:false,fun:"",note:"",found:[]},tm;

function ans(w,q=st.quiz){return q==="capital"?w.c:w.n}
function pool(){return st.ds==="usa"?USA:POOL.filter(w=>!REG[st.region].k||w.k===REG[st.region].k)}
function round(prev){clearTimeout(tm);const p=pool();let t=one(p);while(prev&&p.length>1&&t===prev)t=one(p);st.t=t;st.picked=null;st.hint=1;st.fun="";st.note="";
 if(st.style==="mc"){const base=st.ds==="usa"?USA:POOL;const same=base.filter(w=>w.k===t.k&&w!==t);const o=sh(same.length>=3?same:base.filter(w=>w!==t)).slice(0,3).map(w=>ans(w));st.opts=sh([...o,ans(t)])}render()}
function restart(p){Object.assign(st,p,{score:0,lives:3,streak:0,done:0,won:false});round()}
function resolve(ok,choice){if(st.picked)return;st.picked=choice;let ms=ok?800:1500;
 if(ok){const fact=(st.ds==="usa"?US_FACTS:FACTS)[st.t.n];st.fun=fact?"Fun fact: "+fact:"";if(fact)ms=3000;
  if(st.ds==="world"){const hit=SPRITES.filter(x=>x.country===st.t.n);if(hit.length){hit.forEach(x=>{if(!st.found.includes(x.id))st.found.push(x.id)});st.note="Collected: "+hit.map(x=>x.name).join(" + ")}}
  st.streak++;st.score+=Math.max(10,(st.style==="mc"&&st.quiz==="clues"?50-st.hint*10:30)+st.streak*5);st.best=Math.max(st.best,st.score)}else{st.lives--;st.streak=0}

 if(st.done>=10){tm=setTimeout(()=>{st.won=true;render()},ms);return}
 const prev=st.t;tm=setTimeout(()=>round(prev),ms)}
function btns(el,items,cur,fn){$(el).innerHTML="";items.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;if(k===cur)b.className="on";b.onclick=()=>fn(k);$(el).appendChild(b)})}
function pix(sp,cell,x,y,cls){const g=document.createElementNS(NS,"g");g.setAttribute("class",cls);g.setAttribute("pointer-events","none");g.setAttribute("transform","translate("+x+" "+y+")");
 sp.rows.forEach((row,ry)=>row.split("").forEach((ch,rx)=>{if(ch===".")return;const r=document.createElementNS(NS,"rect");r.setAttribute("x",rx*cell);r.setAttribute("y",ry*cell);r.setAttribute("width",cell+.3);r.setAttribute("height",cell+.3);r.setAttribute("fill",PAL[ch]);g.appendChild(r)}));return g}
function render(){const t=st.t,usa=st.ds==="usa",over=st.lives<=0,ended=over||st.won;
 btns("ds",[["world","World"],["usa","USA states"]],st.ds,k=>restart(k==="usa"?{ds:k,region:"US",quiz:"country"}:{ds:k,region:"world",quiz:"country"}));
 btns("styles",[["mc","Multiple choice"],["map","Click the map"]],st.style,k=>restart({style:k}));
 if(st.style==="mc")btns("sub",Object.entries(QUIZ).filter(([k])=>!usa||k==="country"||k==="capital"),st.quiz,k=>restart({quiz:k}));else btns("sub",[["n","By name"],["c","By capital"]],st.byCap?"c":"n",k=>{st.byCap=k==="c";restart({})});
 $("regs").style.display=usa?"none":"";if(!usa)btns("regs",Object.entries(REG).filter(([k])=>k!=="US").map(([k,v])=>[k,v.l]),st.region,k=>restart({region:k}));

 const clues=[["Continent",CONT[t.k]],["Currency",t.m||"?"],["Starts with",t.n[0]],["Capital",t.c]].slice(0,st.hint);
 let q;if(st.won)q="LEVEL CLEARED!<br>"+st.score+" pts · "+st.lives+" ♥ left";else if(over)q="GAME OVER<br>"+st.done+"/10 · "+st.score;else if(st.style==="map")q=st.byCap?`Click the country whose capital is<br><b>${t.c}</b>`:`Find<br><b>${t.n}</b>`;
 else if(st.quiz==="country")q=usa?`Which state?<br>Capital: ${t.c}`:`Which country?<br>Capital: ${t.c}<br>Continent: ${CONT[t.k]}`;else if(st.quiz==="capital")q=`<div class="big">${t.f||""}</div>Capital of ${t.n}?`;
 else if(st.quiz==="flag")q=`<div class="big">${t.f}</div>Which country?`;else q=clues.map(c=>`<div>${c[0]}: ${c[1]}</div>`).join("");
 $("q").innerHTML=q;const o=$("o");o.innerHTML="";
 if(ended){const b=document.createElement("button");b.className="opt";b.textContent=st.won?"Next level":"Play again";b.onclick=()=>restart({});o.appendChild(b)}
 else if(st.style==="mc"){const a=ans(t);st.opts.forEach(x=>{const b=document.createElement("button");b.className="opt"+(st.picked&&x===a?" ok":st.picked===x?" no":"");b.textContent=x;b.disabled=!!st.picked;b.onclick=()=>resolve(x===a,x);o.appendChild(b)});
  if(st.quiz==="clues"){const b=document.createElement("button");b.className="opt";b.textContent="Next clue (-10 pts)";b.disabled=!!st.picked||st.hint>=4;b.onclick=()=>{st.hint++;render()};o.appendChild(b)}}
 const mw=$("mapw");mw.innerHTML="";

  (usa?USA:WORLD).forEach(w=>{const p=document.createElementNS(NS,"path");p.setAttribute("d",w.d);const play=usa||(!!w.c&&w.k!=="AN"&&(!r.k||w.k===r.k));let c=play?"c":"x";if(st.picked&&w.n===t.n)c+=" ok";else if(st.picked&&w.n===st.picked)c+=" no";p.setAttribute("class",c);if(play&&!ended)p.onclick=()=>resolve(w.n===t.n,w.n);svg.appendChild(p)});
  if(!usa){const [vx,,vw]=r.vb.split(" ").map(Number);const cell=(28*vw)/(350*parseFloat(r.w)/100*9);
   SPRITES.filter(sp=>!r.k||sp.k===r.k).forEach(sp=>{const w=9*cell,h=sp.rows.length*cell;svg.appendChild(pix(sp,cell,(sp.lon+180)*5-w/2,(84-sp.lat)*5-h/2,st.found.includes(sp.id)?"sp got":"sp"))})}
  mw.appendChild(svg)}

 if(!usa){SPRITES.forEach(sp=>{const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 9 9");if(st.found.includes(sp.id))s.setAttribute("class","got");const ti=document.createElementNS(NS,"title");ti.textContent=st.found.includes(sp.id)?sp.name+" ("+sp.country+")":"?";s.appendChild(ti);sp.rows.forEach((row,ry)=>row.split("").forEach((ch,rx)=>{if(ch===".")return;const r=document.createElementNS(NS,"rect");r.setAttribute("x",rx);r.setAttribute("y",ry+9-sp.rows.length);r.setAttribute("width",1.02);r.setAttribute("height",1.02);r.setAttribute("fill",PAL[ch]);s.appendChild(r)}));cl.appendChild(s)});
  $("cn").textContent="Collected "+st.found.length+"/"+SPRITES.length+": answer a country right to unlock its monument, food or animal."}
 $("b").textContent="Best this session: "+st.best+". "+(usa?"50 states":POOL.length+" countries")+". 3 lives, 10 questions to clear a level."}
round();
